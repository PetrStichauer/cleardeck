<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="deck-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="deck-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#deck-bg)"/>
  <!-- stacked deck cards -->
  <rect x="128" y="168" width="256" height="176" rx="20" fill="url(#deck-card)" opacity="0.45" transform="rotate(-6 256 256)"/>
  <rect x="136" y="156" width="256" height="176" rx="20" fill="url(#deck-card)" opacity="0.7" transform="rotate(-2 264 244)"/>
  <rect x="144" y="144" width="256" height="176" rx="20" fill="url(#deck-card)"/>
  <!-- checkmark on top card -->
  <path d="M208 232 L240 268 L304 196"
        stroke="#0369a1" stroke-width="28"
        stroke-linecap="round" stroke-linejoin="round"
        fill="none"/>
</svg>
